<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propuesta - Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="06-contacto.css">
</head>
<body>
<section class="container py-5" aria-labelledby="contacto-title">
  <h2 id="contacto-title" class="mb-4">Contacto</h2>
  <form class="row g-3" novalidate>
    <div class="col-md-6">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" required autocomplete="name">
    </div>
    <div class="col-md-6">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" required autocomplete="tel">
    </div>
    <div class="col-12">
      <label for="mensaje" class="form-label">Mensaje</label>
      <textarea class="form-control" id="mensaje" rows="4" required></textarea>
    </div>
    <div class="col-12">
      <button class="btn btn-danger" type="submit">Enviar</button>
    </div>
  </form>
</section>
</body>
</html>
