<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propuesta - Menú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="03-menu.css">
</head>
<body>
<section class="container py-5" aria-labelledby="menu-title">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <h2 id="menu-title" class="mb-0">Menú</h2>
    <label class="visually-hidden" for="filtroMenu">Filtrar platillos</label>
    <input id="filtroMenu" class="form-control filtro" type="search" placeholder="Buscar en el menú" aria-describedby="ayudaFiltro">
  </div>
  <p id="ayudaFiltro" class="text-muted small">Facilita encontrar productos sin cambiar el contenido.</p>

  <div class="row g-4">
    <article class="col-sm-6 col-lg-4">
      <div class="card h-100 menu-card">
        <img src="https://via.placeholder.com/640x420" class="card-img-top" alt="Nombre original del producto 1" loading="lazy">
        <div class="card-body">
          <h3 class="h5">Producto original 1</h3>
          <p class="mb-2">Descripción original del sitio.</p>
          <p class="precio mb-0" aria-label="Precio del producto">$00.00</p>
        </div>
      </div>
    </article>

    <article class="col-sm-6 col-lg-4">
      <div class="card h-100 menu-card">
        <img src="https://via.placeholder.com/640x420" class="card-img-top" alt="Nombre original del producto 2" loading="lazy">
        <div class="card-body">
          <h3 class="h5">Producto original 2</h3>
          <p class="mb-2">Descripción original del sitio.</p>
          <p class="precio mb-0">$00.00</p>
        </div>
      </div>
    </article>
  </div>
</section>
</body>
</html>
