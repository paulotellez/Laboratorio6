<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propuesta - Promociones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="04-promociones.css">
</head>
<body>
<section class="container py-5" aria-labelledby="promo-title">
  <h2 id="promo-title" class="mb-4">Promociones</h2>
  <div id="carouselPromos" class="carousel slide" data-bs-ride="carousel" aria-label="Carrusel de promociones">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselPromos" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Promoción 1"></button>
      <button type="button" data-bs-target="#carouselPromos" data-bs-slide-to="1" aria-label="Promoción 2"></button>
    </div>
    <div class="carousel-inner rounded-4 overflow-hidden">
      <div class="carousel-item active">
        <img src="https://via.placeholder.com/1200x480" class="d-block w-100" alt="Promoción original 1">
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/1200x480" class="d-block w-100" alt="Promoción original 2">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselPromos" data-bs-slide="prev" aria-label="Promoción anterior">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselPromos" data-bs-slide="next" aria-label="Siguiente promoción">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
